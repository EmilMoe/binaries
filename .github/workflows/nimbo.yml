name: Nimbo

# Builds Nimbo from the private EmilMoe/S3Client repo. The source is only checked out on
# the runner; this repo holds the releases and nimbo/latest.json, which the installed apps
# check for updates.
#
# Started by S3Client when a tag like v0.2.0 is pushed (repository_dispatch), or by hand from
# the Actions tab. A v* ref publishes release nimbo-<ref>; any other ref only builds.
#
# Files per platform:
#   macOS   Nimbo.dmg       (universal: Apple Silicon + Intel)
#   Windows Nimbo.exe       (portable, needs the WebView2 runtime built into Windows 10/11)
#           Nimbo.msi       (installer; the portable exe cannot be auto-updated by Tauri's updater)
#   Linux   Nimbo.AppImage  (portable, needs FUSE)
# plus the signed updater files (Nimbo.app.tar.gz, .msi and .AppImage with .sig).
#
# Secrets: APPS_TOKEN (fine-grained, Contents read on EmilMoe/S3Client),
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
on:
  repository_dispatch:
    types: [nimbo-release]
  workflow_dispatch:
    inputs:
      ref:
        description: S3Client tag or branch (v* publishes a release)
        required: true
        default: main

# The logs are public: keep compiler warnings (which quote source lines) out of them.
env:
  REF: ${{ github.event.client_payload.ref || inputs.ref }}
  RUSTFLAGS: -Awarnings

concurrency: nimbo-${{ github.event.client_payload.ref || inputs.ref }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: --bundles msi
            rust-targets: ""
          - platform: ubuntu-22.04
            args: --bundles appimage
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: EmilMoe/S3Client
          ref: ${{ env.REF }}
          token: ${{ secrets.APPS_TOKEN }}
          persist-credentials: false

      - name: Check that the tag matches the app version
        if: startsWith(env.REF, 'v')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$REF" ]; then
            echo "::error::Tag $REF doesn't match version $version in tauri.conf.json (run npm run bump)"
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev libdbus-1-dev

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Runs always start from this repo's main, so the cache carries over between releases.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: nimbo

      - run: npm ci

      - run: npm run tauri -- build ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect files with fixed names
        shell: bash
        run: |
          mkdir dist
          case "$RUNNER_OS" in
            macOS)
              b=src-tauri/target/universal-apple-darwin/release/bundle
              cp $b/dmg/*.dmg dist/Nimbo.dmg
              cp $b/macos/*.app.tar.gz dist/Nimbo.app.tar.gz
              cp $b/macos/*.app.tar.gz.sig dist/Nimbo.app.tar.gz.sig ;;
            Windows)
              cp src-tauri/target/release/bundle/msi/*.msi dist/Nimbo.msi
              cp src-tauri/target/release/bundle/msi/*.msi.sig dist/Nimbo.msi.sig
              cp src-tauri/target/release/s3client.exe dist/Nimbo.exe ;;
            Linux)
              cp src-tauri/target/release/bundle/appimage/*.AppImage dist/Nimbo.AppImage
              cp src-tauri/target/release/bundle/appimage/*.AppImage.sig dist/Nimbo.AppImage.sig ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: s3-browser-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.event.client_payload.ref || inputs.ref, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: EmilMoe/S3Client
          ref: ${{ env.REF }}
          token: ${{ secrets.APPS_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: src

      - uses: actions/download-artifact@v7
        with:
          pattern: s3-browser-*
          path: dist
          merge-multiple: true

      - name: Release notes from the commits since the previous tag
        run: |
          prev=$(git -C src describe --tags --abbrev=0 --match 'v*' "$REF^" 2>/dev/null || true)
          git -C src log --no-merges --pretty='- %s' ${prev:+$prev..}"$REF" \
            | sed -E '/^- Version [0-9]+\.[0-9]+\.[0-9]+$/d; s/ \(closes #[0-9]+\)//' > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat notes.md
            echo
            cat <<'NOTE'
          **macOS:** the app isn't notarized by Apple, so the first launch says "Nimbo" Not Opened. Click Done, then open System Settings → Privacy & Security and click **Open Anyway**. Or run `xattr -dr com.apple.quarantine "/Applications/Nimbo.app"` in Terminal. Updates installed from within the app open normally.

          **Windows:** Nimbo.exe is portable and needs the WebView2 runtime (built into Windows 10/11); use Nimbo.msi for auto-updates. If SmartScreen warns, click More info → Run anyway.

          **Linux:** the AppImage needs FUSE.
          NOTE
          } > body.md
          gh release create "nimbo-$REF" $(ls dist/* | grep -v '\.sig$') \
            --repo "$GITHUB_REPOSITORY" --target main \
            --title "Nimbo $REF" --notes-file body.md

      - name: Update nimbo/latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/nimbo-$REF"
          jq -n \
            --arg version "${REF#v}" \
            --rawfile notes notes.md \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "$url" \
            --rawfile mac dist/Nimbo.app.tar.gz.sig \
            --rawfile win dist/Nimbo.msi.sig \
            --rawfile linux dist/Nimbo.AppImage.sig \
            '{version: $version, notes: ($notes | rtrimstr("\n")), pub_date: $date, platforms: {
              "darwin-aarch64": {signature: ($mac | rtrimstr("\n")), url: "\($url)/Nimbo.app.tar.gz"},
              "darwin-x86_64": {signature: ($mac | rtrimstr("\n")), url: "\($url)/Nimbo.app.tar.gz"},
              "windows-x86_64": {signature: ($win | rtrimstr("\n")), url: "\($url)/Nimbo.msi"},
              "linux-x86_64": {signature: ($linux | rtrimstr("\n")), url: "\($url)/Nimbo.AppImage"}
            }}' > latest.json
          cat latest.json
          # nimbo/ is the manifest the site reads. s3browser/ is what apps older than 0.6.1 fall
          # back to, so it keeps getting the same file.
          for path in nimbo/latest.json s3browser/latest.json; do
            sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
              -f message="Nimbo $REF" \
              -f content="$(base64 -w0 latest.json)" \
              ${sha:+-f sha="$sha"} > /dev/null
          done
